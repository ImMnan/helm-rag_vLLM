apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-http-route
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: orca-infer-gateway
  hostnames:
    - orca-infer.ai
  rules:
#    - matches:
#        - path:
#            type: PathPrefix
#            value: /api/v1/rag-go
#      backendRefs:
#        - name: {{ .Release.Name }}-{{ .Values.services.orca.name }}
#          port: {{ (index .Values.services.orca.ports 0).port }}
    - matches:
        - path: 
            type: PathPrefix
            value: /ui
      backendRefs:
        - name: {{ .Release.Name }}-{{ .Values.services.mini_ui.name }}
          port: {{ (index .Values.services.mini_ui.ports 0).port }}       
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: {{ .Release.Name }}-grpc-route
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: orca-infer-gateway
      sectionName: grpc
  hostnames:
    - orca-infer.ai
  rules:
    - backendRefs:
        - name: qdrant-service
          port: 6334

