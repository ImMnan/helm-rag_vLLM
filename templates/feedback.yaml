apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    tag: {{ .Chart.Version }}-{{ .Release.Name }}
    {{- with .Values.labels.feedback }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  name: {{ .Release.Name }}-feedback
spec:
  replicas: 1
  selector:
    matchLabels:
      tag: {{ .Chart.Version }}-{{ .Release.Name }}
      {{- with .Values.labels.feedback }}
      {{- toYaml . | nindent 6 }}
      {{- end }}      
      
  template:
    metadata:
      labels:
        tag: {{ .Chart.Version }}-{{ .Release.Name }}
        {{- with .Values.labels.feedback }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        gke-gcsfuse/volumes: "true"
    spec:
      serviceAccountName: rag-gateway-ksa  
      automountServiceAccountToken: true
      containers:
      - image: immnan/orca-feedback:0.1.0
        name: orca-feedback
        env: 
        - name: FIBER_PORT
          value: "8080"
        - name: LOG_VERBOSE
          value: "true"
        - name: FEEDBACK_OUTPUT_DIR
          value: /mnt
        resources:
         limits:
           cpu: "250m"
           memory: "1Gi"
         requests:
           cpu: "150m"
           memory: "512Mi"
        securityContext: 
          runAsUser: 2000
          runAsGroup: 2000
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault   
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080             
        volumeMounts:
        - name: feedback-volume
          mountPath: /mnt
      volumes:
        - name: feedback-volume
          csi:
            driver: gcsfuse.csi.storage.gke.io
            volumeAttributes:
              bucketName: rag-model-weights-hawk
              mountOptions: "implicit-dirs,only-dir=feedback"
