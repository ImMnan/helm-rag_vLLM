apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: orca-feedback
  name: orca-feedback
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orca-feedback
  template:
    metadata:
      labels:
        app: orca-feedback
      annotations:
        gke-gcsfuse/volumes: "true"
    spec:
      serviceAccountName: rag-gateway-ksa  
      automountServiceAccountToken: true
      containers:
      - image: immnan/orca-feedback:0.1.0
        name: orca-feedback
        env: 
        - name: FIBER_PORT
          value: "8080"
        - name: LOG_VERBOSE
          value: "true"
        - name: FEEDBACK_OUTPUT_DIR
          value: /mnt
        resources:
         limits:
           cpu: "250"
           memory: "1Gi"
         requests:
           cpu: "150m"
           memory: "512Mi"
        securityContext: 
          runAsUser: 2000
          runAsGroup: 2000
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault    
        volumeMounts:
        - name: feedback-volume
          mountPath: /mnt
      volumes:
        - name: feedback-volume
          csi:
            driver: gcsfuse.csi.storage.gke.io
            volumeAttributes:
              bucketName: rag-model-weights-hawk
              mountOptions: "implicit-dirs,only-dir=feedback"
