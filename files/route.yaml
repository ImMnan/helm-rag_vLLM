apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: default-http-route
  namespace: hawk
spec:
  parentRefs:
    - name: orca-infer-gateway
  hostnames:
    - orca-infer.ai
  rules:
    - matches: 
        - path: 
            type: PathPrefix
            value: /q1
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: qdrant-service
          port: 6333
    - matches:
        - path:
            type: PathPrefix
            value: /auth
      backendRefs:
        - name: kc-keycloakx-http   # ⬅️ Matches the active running service name
          port: 80
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /